# Builds every push and pull request so a broken build or a new high-severity advisory is caught before deploying.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Check prerendered pages exist
        run: test -f dist/index.html && test -f dist/pricing.html && test -f dist/404.html && test -f dist/sitemap.xml
